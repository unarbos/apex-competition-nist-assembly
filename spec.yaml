schema: apex.competition.v1
id: nist_lite_assembly
version: 0.3.0
display_name: "NIST-Lite Robot Assembly (RL)"
kind: solo
process_type: cpu

# Same limits for player and referee sandboxes. 2 CPU / 2Gi fits the stage ceiling.
resources:
  cpu_limit: 2
  mem_limit: 2Gi
  gpu_count: 0

# PLAYER image: serves the miner's ONNX policy over gym_v1 (player/Dockerfile).
image:
  ref: ghcr.io/unarbos/apex-competition-nist-assembly-player
  digest: sha256:fdc5b3796a6575c1b661ab50674bb7a006fbd385bac142eb5790bd3282c91857

submission:
  artifact_type: onnx
  max_size_mb: 50
  target_path: /app/policy.onnx

screening:
  max_size_mb: 50
  min_weight_bytes: 256

input_schema:
  $ref: ./input.schema.json

defaults:
  baseline_score: 0.0
  # Platform convention for spec competitions: no floor, so the first scored submission of a
  # round with no top scorer takes it; after that challengers must beat the incumbent by 1%.
  baseline_raw_score: 0.0
  round_length_in_days: 1
  submission_reveal_days: 1
  lower_is_better: false

entrypoints:
  evaluate:
    command: ["python", "/app/launch.py", "--port", "8000"]
    network_disabled: false
    allow_internet: false
    # 1800 s (since 0.2.1): headroom for the live 128-episode rounds (16/stratum); ~400-660 s observed on Macrocosmos staging.
    timeout_s: 1800
    http_api:
      port: 8000
      readiness_path: /health
      protocol: gym_v1

referee:
  protocol: gym_v1
  image:
    # Private package; built with reserved.json from the NIST_HELDOUT_SEED build secret.
    ref: ghcr.io/unarbos/apex-competition-nist-assembly-referee
    digest: sha256:eea3403f32d5783e5d8905cc03d20958d62a7ca6682b305b4a07e396ee3ea0ce
  timeout_s: 1800

signature:
  # Fulcio SAN of a GitHub keyless signature is `<workflow path>@<ref>`; the platform matches it exactly.
  cosign_identity: https://github.com/unarbos/apex-competition-nist-assembly/.github/workflows/release.yml@refs/tags/*
  cosign_issuer: https://token.actions.githubusercontent.com
