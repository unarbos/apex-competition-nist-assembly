# Unit + integration tests (referee and player run in-process via tools/local_run.py).
# Also called by release.yml, so an image is never built from a commit whose tests fail.
name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # compound integration runs are longer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r referee/requirements.txt -r player/requirements.txt pytest
      - name: Build reference and test-set policies
        run: python tools/make_policies.py
      - name: Assert Dockerfile text bakes v08
        # Text check only; the referee-image job builds the image and asserts the runtime default.
        run: |
          grep -E 'ENV .+NIST_PROFILE=v08' referee/Dockerfile
          ! grep -E 'NIST_PROFILE=v07$' referee/Dockerfile
      - name: pytest
        env:
          # Live task profile for in-process tests. Image default is asserted in referee-image job
          # without this env. Tests that exercise v0.5 / v0.6 / v0.7 behaviour select those
          # profiles explicitly.
          NIST_PROFILE: v08
        run: pytest -q tests/

  # Build the real referee image and fail if the baked default is not Assembly IV / v08.
  # Intentionally does NOT set NIST_PROFILE in the container.
  referee-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build referee image
        run: docker build -f referee/Dockerfile -t nist-assembly-referee:ci .
      - name: Assert image default profile is v08 (no env override)
        run: |
          set -euo pipefail
          # ENV baked into the image
          docker image inspect nist-assembly-referee:ci \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^NIST_PROFILE=v08$'
          # Runtime: unset any host NIST_PROFILE and import referee the way CMD does.
          out=$(docker run --rm --entrypoint python nist-assembly-referee:ci -c \
            'import os; os.environ.pop("NIST_PROFILE", None); import referee; print(referee._PROFILE_NAME, referee.ASSEMBLY_IV)')
          echo "runtime: $out"
          echo "$out" | grep -E '^v08 True$'
      - name: Install host player and policy-build dependencies
        run: pip install -r referee/requirements.txt -r player/requirements.txt
      - name: Build reference ONNX policy
        run: python tools/make_policies.py
      - name: Measure 64-episode wall inside built referee image
        run: >-
          python tools/docker_wall_v08.py
          --image nist-assembly-referee:ci
          --policy baselines/baseline.onnx
          --seed 7
          --cpus 0,1
          --out artifacts/referee-wall-64
      - name: Upload built-image wall measurement
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: always()
        with:
          name: referee-wall-64
          path: artifacts/referee-wall-64
