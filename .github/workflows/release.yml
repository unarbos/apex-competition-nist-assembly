# RELEASE WORKFLOW: builds, pushes, and keyless-signs (cosign / GitHub OIDC) the player and
# referee images for this repository (ghcr.io/<owner>/apex-competition-nist-assembly-*).
#
# spec.yaml `signature.cosign_identity` points at THIS file's path. Keep the path
# `.github/workflows/release.yml` and the repo name stable, or signature verification breaks.
#
# Required repository secret:
#   NIST_HELDOUT_SEED  referee build input (BuildKit secret mount; never written to the repo or logs).
#
# Outputs: each image's pushed digest is uploaded as an artifact (digest-player / digest-referee)
# and written to the job summary. Copy both into spec.yaml (`image.digest`, `referee.image.digest`).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write            # required for keyless cosign signing

jobs:
  test:
    uses: ./.github/workflows/test.yml

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: player,  dockerfile: player/Dockerfile }
          - { name: referee, dockerfile: referee/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/apex-competition-nist-assembly-${{ matrix.name }}
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Check referee build secret
        if: matrix.name == 'referee'
        env:
          NIST_HELDOUT_SEED: ${{ secrets.NIST_HELDOUT_SEED }}
        run: |
          if [ -z "$NIST_HELDOUT_SEED" ]; then echo "::error::secret NIST_HELDOUT_SEED is not set"; exit 1; fi
      - name: Build and push
        id: build
        env:
          NIST_HELDOUT_SEED: ${{ secrets.NIST_HELDOUT_SEED }}
        run: |
          SECRET_ARGS=""
          if [ "${{ matrix.name }}" = "referee" ]; then SECRET_ARGS="--secret id=heldout_seed,env=NIST_HELDOUT_SEED"; fi
          docker build $SECRET_ARGS -f ${{ matrix.dockerfile }} -t "$IMAGE:${{ github.ref_name }}" .
          docker push "$IMAGE:${{ github.ref_name }}"
          REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.ref_name }}")
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "${REF#*@}" > digest-${{ matrix.name }}.txt
          echo "${{ matrix.name }}: \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.ref }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt
